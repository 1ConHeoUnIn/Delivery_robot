<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiến trúc Hệ thống AGV - Lê Quý Hữu</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { position: relative; width: 800px; height: 600px; }
        
        /* Node Style */
        .node { position: absolute; width: 120px; height: 120px; border-radius: 50%; background-color: #2a2a35; border: 3px solid #5a5a6a; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: transform 0.2s, border-color 0.2s; cursor: pointer; }
        .node:hover { transform: scale(1.1); border-color: #4da6ff; box-shadow: 0 0 30px rgba(77, 166, 255, 0.4); }
        .node span { margin-top: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .icon { font-size: 30px; }

        /* Tọa độ các Node */
        #master { top: 20px; left: 340px; }
        #camera { top: 200px; left: 600px; }
        #brain { top: 400px; left: 340px; }
        #comm { top: 200px; left: 80px; }
        #action { top: 200px; left: 340px; border-color: #e0e0e0; background-color: #3a3a45; } /* Center Node */

        /* SVG Arrow Lines */
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .line { stroke-width: 3; fill: none; stroke-dasharray: 8; animation: dash 1s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -16; } }
        
        .label { position: absolute; font-size: 12px; color: #b0b0b0; background: #121212; padding: 2px 5px; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <svg>
        <defs>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80" /></marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" /></marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171" /></marker>
            <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" /></marker>
        </defs>

        <path d="M 460 80 Q 560 100 640 200" class="line" stroke="#9ca3af" marker-end="url(#arrow-gray)"/>
        <path d="M 620 310 Q 550 400 450 440" class="line" stroke="#4ade80" marker-end="url(#arrow-green)"/>
        <path d="M 340 440 Q 250 400 180 310" class="line" stroke="#fb923c" marker-end="url(#arrow-orange)"/>
        <path d="M 200 260 L 325 260" class="line" stroke="#f87171" marker-end="url(#arrow-red)"/>
    </svg>

    <div class="label" style="top: 130px; left: 530px; color: #9ca3af;">Ánh sáng/Hình ảnh</div>
    <div class="label" style="top: 350px; left: 520px; color: #4ade80;">Luồng MJPEG (HTTP)</div>
    <div class="label" style="top: 350px; left: 160px; color: #fb923c;">Lệnh (W,S,L,R)</div>
    <div class="label" style="top: 235px; left: 220px; color: #f87171;">Gói tin UDP</div>

    <div class="node" id="master">
        <div class="icon">👤</div>
        <span>Master<br>(Người dùng)</span>
    </div>
    <div class="node" id="camera">
        <div class="icon">📱</div>
        <span>Camera<br>(Phone)</span>
    </div>
    <div class="node" id="brain">
        <div class="icon">🧠</div>
        <span>Brain<br>(Laptop/AI)</span>
    </div>
    <div class="node" id="comm">
        <div class="icon">🛜</div>
        <span>Comm<br>(WiFi/UDP)</span>
    </div>
    <div class="node" id="action">
        <div class="icon">⚙️</div>
        <span>Action<br>(ESP32/Motors)</span>
    </div>
</div>

</body>
</html>
